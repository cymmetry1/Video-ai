<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><div class="badge">PRIVATE RESEARCH TOOL</div><h1>Character Swap</h1><p class="sub">One face. One video. Clean swap.</p><form id="form"><section><span>01</span><h2>Source face</h2><p>Use a clear, front-facing image.</p><label><input id="source" name="source" type="file" accept="image/*" required><b>Choose image</b><small id="sourceName">JPG, PNG or WEBP</small></label></section><section><span>02</span><h2>Target video</h2><p>Upload the video you want to transform.</p><label><input id="target" name="target" type="file" accept="video/*" required><b>Choose video</b><small id="targetName">MP4, MOV, MKV or WEBM</small></label></section><button id="go">Generate swap</button></form><div id="status"></div><video id="result" controls playsinline></video><a id="download" download="swap.mp4">Save MP4</a><footer>Use only with content and likenesses you have permission to use.</footer></main><script src="/static/app.js"></script></body></html>
